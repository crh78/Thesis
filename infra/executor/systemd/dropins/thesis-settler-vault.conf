# Install as /etc/systemd/system/thesis-settler.service.d/vault.conf to load the settler key from
# OCI Vault (thesis-settler-key.service) instead of /etc/thesis/settler.json.
[Unit]
Requires=thesis-settler-key.service
After=thesis-settler-key.service

[Service]
# Empty first: replaces the unit's own credential rather than adding a second one.
LoadCredential=
LoadCredential=settler.json:/run/thesis/settler.json
