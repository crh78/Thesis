name: Verifiable build

# A reproducible build of the Thesis program (docs/hardening-plan.md, item 2): solana-verify builds
# it inside a pinned Docker image, so anyone gets the same bytes and hash, and explorers can show a
# deployed program matches this repo. Runs on pushes to main and by hand, not on
# every PR (a from-scratch Docker build is slow). It also runs on a PR that edits this workflow.
on:
  push:
    branches: [main]
    paths:
      - "anchor/**"
      - ".github/workflows/verifiable-build.yml"
  pull_request:
    paths:
      - ".github/workflows/verifiable-build.yml"
  workflow_dispatch:

concurrency:
  group: verifiable-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLANA_VERIFY_VERSION: "0.5.2"
  # solanafoundation/solana-verifiable-build:4.1.2 (anchor/Anchor.toml's solana_version), by digest.
  BASE_IMAGE: "solanafoundation/solana-verifiable-build@sha256:2e0b78f44ee76612e9260c7c988570c5e14de6fbd93e0ab07115ec7054473b4f"

jobs:
  build:
    name: Reproducible build and hash
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: anchor
    steps:
      - uses: actions/checkout@v4

      - name: Cache solana-verify
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/solana-verify
          key: solana-verify-${{ runner.os }}-${{ env.SOLANA_VERIFY_VERSION }}

      - name: Install solana-verify
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install solana-verify --version "$SOLANA_VERIFY_VERSION" --locked

      - name: Build in the pinned image
        run: solana-verify build --library-name thesis --base-image "$BASE_IMAGE"

      - name: Hash
        run: |
          hash=$(solana-verify get-executable-hash target/deploy/thesis.so)
          # The build ran as root inside Docker, so target/ isn't writable here: collect the
          # binary and its hash in the runner's temp folder.
          out="$RUNNER_TEMP/verifiable"
          mkdir -p "$out"
          cp target/deploy/thesis.so "$out/"
          echo "$hash" > "$out/thesis.so.sha256"
          {
            echo "### Thesis program, verifiable build"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${BASE_IMAGE}\`"
            echo "- Executable hash: \`${hash}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "executable hash: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: thesis-verifiable-${{ github.sha }}
          path: ${{ runner.temp }}/verifiable/
