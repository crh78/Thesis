[package]
name = "thesis"
version = "0.1.0"
description = "Thesis: on-chain takes, receipts and scores"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "thesis"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "1.2.2", features = ["token", "token_2022", "associated_token"] }

[dev-dependencies]
# Cargo.lock pins LiteSVM's Rust-1.89-compatible dependency graph.
litesvm = "0.15.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-account = "4"
solana-clock = "3"
proptest = "1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
